name: Veille CERT-FR

on:
  schedule:
    - cron: "17 6 * * *"   # chaque jour vers 8 h, heure de Paris
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/cert-fr.py
      - name: Commit si la page a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veille.html
          git diff --cached --quiet || git commit -m "veille: alertes CERT-FR du $(date +%F)"
          git push
